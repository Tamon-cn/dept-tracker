<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบปล่อยเงินกู้</title>
<style>
  :root{
    --ink:#1c1917; --paper:#f1efe9; --paper2:#ffffff; --line:#e4dfd3;
    --sub:#78716c; --accent:#0f5c52; --accent-ink:#ffffff;
    --daily:#dc2626; --daily-bg:#fef2f2;
    --weekly:#ea580c; --weekly-bg:#fff7ed;
    --monthly:#16a34a; --monthly-bg:#f0fdf4;
    --danger:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#f2efe9; --paper:#15130f; --paper2:#201d18; --line:#39352b;
      --sub:#a39b8c; --accent:#3ba795; --accent-ink:#0c1210;
      --daily-bg:#2a1616; --weekly-bg:#2a1e12; --monthly-bg:#132a19;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f2efe9; --paper:#15130f; --paper2:#201d18; --line:#39352b;
    --sub:#a39b8c; --accent:#3ba795; --accent-ink:#0c1210;
    --daily-bg:#2a1616; --weekly-bg:#2a1e12; --monthly-bg:#132a19;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Sarabun",sans-serif;
    background:var(--paper); color:var(--ink);
  }
  .tabnum{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}

  /* ---- shell layout ---- */
  .app-shell{display:grid; grid-template-columns:240px 1fr 280px; min-height:100vh;}
  @media(max-width:1024px){
    .app-shell{grid-template-columns:1fr;}
    .sidebar,.rightpanel{
      position:fixed; top:0; bottom:0; width:270px; z-index:60;
      transition:transform .25s ease; box-shadow:0 0 24px rgba(0,0,0,.2);
    }
    .sidebar{left:0; transform:translateX(-105%);}
    .rightpanel{right:0; transform:translateX(105%);}
    .sidebar.open{transform:translateX(0);}
    .rightpanel.open{transform:translateX(0);}
    .icon-btn{display:flex !important;}
  }
  .backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:55;
  }
  .backdrop.show{display:block;}

  /* ---- sidebar ---- */
  .sidebar{
    background:var(--paper2); border-right:1px solid var(--line);
    padding:20px 16px; overflow-y:auto;
    padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .brand .emoji{font-size:30px; line-height:1;}
  .brand strong{display:block; font-size:14.5px; line-height:1.3;}
  .brand .sub{font-size:10.5px; color:var(--sub); letter-spacing:.08em; font-weight:700;}
  .addbtn-main{
    width:100%; background:var(--accent); color:var(--accent-ink); border:none;
    border-radius:10px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; margin-bottom:18px;
  }
  .addbtn-main:active{opacity:.85;}
  .nav-title{font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.06em; margin:4px 2px 8px; font-weight:700;}
  .nav-item{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none;
    background:transparent; color:var(--ink); padding:10px 10px; border-radius:9px;
    font-size:13.5px; cursor:pointer; margin-bottom:2px;
  }
  .nav-item.active{background:var(--paper); font-weight:700;}
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--sub);}
  .dot.all{background:var(--accent);}
  .dot.daily{background:var(--daily);}
  .dot.weekly{background:var(--weekly);}
  .dot.monthly{background:var(--monthly);}
  .cnt{margin-left:auto; font-size:10.5px; color:var(--sub); background:var(--paper); padding:2px 7px; border-radius:100px;}
  .nav-item.active .cnt{background:var(--paper2);}

  /* ---- main ---- */
  .main{padding:18px 18px 50px; min-width:0;}
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .topbar h1{font-size:19px; margin:0; flex:1;}
  .icon-btn{
    display:none; width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper2); font-size:16px; cursor:pointer; align-items:center; justify-content:center;
  }
  .search-wrap{position:relative; margin-bottom:14px;}
  .search-wrap .ico{position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--sub); pointer-events:none;}
  .search-wrap input{width:100%; padding:11px 36px; border:1px solid var(--line); border-radius:10px; background:var(--paper2); color:var(--ink); font-size:14px;}
  .search-wrap .clear{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:var(--paper); color:var(--sub); width:24px; height:24px; border-radius:50%; font-size:13px; cursor:pointer; display:none; align-items:center; justify-content:center;}
  .search-wrap .clear.show{display:flex;}
  .stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px;}
  @media(max-width:640px){ .stats-row{grid-template-columns:1fr;} }
  .stat-card{
    background:var(--paper2); border:1px solid var(--line); border-top:4px solid var(--c);
    border-radius:14px; padding:16px;
  }
  .stat-card .lbl{font-size:12px; color:var(--sub);}
  .stat-card .val{font-size:21px; font-weight:700; margin-top:4px;}
  .filter-note{font-size:12.5px; color:var(--sub); margin:-8px 0 14px;}
  .list{display:flex; flex-direction:column; gap:10px;}
  .empty{color:var(--sub); text-align:center; padding:50px 20px; font-size:14px;}

  /* ---- debtor card ---- */
  .card{
    background:var(--paper2); border:1px solid var(--line); border-left:5px solid var(--c);
    border-radius:12px; padding:14px;
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-name{font-size:15.5px; font-weight:700;}
  .card-phone{font-size:12.5px; color:var(--sub); margin-top:2px;}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px; background:var(--bg); color:var(--c); white-space:nowrap;}
  .grid4{display:grid; grid-template-columns:1fr; gap:0; margin-top:12px; font-size:13px;}
  .grid4 .lbl{color:var(--sub);}
  .grid4 .row{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line);}
  .remain{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline;}
  .remain .lbl{font-size:13px; color:var(--sub);}
  .remain .val{font-size:18px; font-weight:700;}
  .bar{height:6px; border-radius:100px; background:var(--line); overflow:hidden; margin-top:8px;}
  .bar > div{height:100%; background:var(--c);}
  .actions{display:flex; gap:8px; margin-top:12px;}
  .actions button{flex:1; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:8px; padding:8px 6px; font-size:12.5px; cursor:pointer;}
  .actions button.pay{background:var(--c); border-color:var(--c); color:#fff; font-weight:700;}
  .actions button.del{color:var(--danger); border-color:transparent;}
  .actions2{display:flex; gap:8px; margin-top:8px;}
  .actions2 button{flex:1; border:1px dashed var(--c); background:transparent; color:var(--c); border-radius:8px; padding:7px 6px; font-size:12.5px; cursor:pointer; font-weight:700;}

  /* ---- right panel ---- */
  .rightpanel{background:var(--paper2); border-left:1px solid var(--line); padding:18px; overflow-y:auto;}
  .panel-card{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px;}
  .panel-title{font-size:11.5px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-head button{width:26px; height:26px; border-radius:7px; border:1px solid var(--line); background:var(--paper2); cursor:pointer; font-size:13px;}
  .cal-head span{font-size:13px; font-weight:700;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center;}
  .cal-dow{font-size:10px; color:var(--sub); padding:3px 0; font-weight:700;}
  .cal-day{
    position:relative; font-size:12px; padding:6px 0; border-radius:7px; color:var(--ink);
  }
  .cal-day.today{background:var(--accent); color:var(--accent-ink); font-weight:700;}
  .cal-day .pdot{position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent);}
  .cal-day.today .pdot{background:var(--accent-ink);}
  .bd-row{display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 0;}
  .bd-row .cnt2{margin-left:auto; font-weight:700;}

  /* ---- modal ---- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:70; padding-bottom:env(safe-area-inset-bottom,0px);}
  @media(min-width:640px){ .overlay{align-items:center;} }
  .sheet{background:var(--paper2); width:100%; max-width:440px; border-radius:16px 16px 0 0; padding:20px; max-height:88vh; overflow-y:auto;}
  @media(min-width:640px){ .sheet{border-radius:16px;} }
  .sheet h2{margin:0 0 14px; font-size:17px;}
  label{display:block; font-size:12.5px; color:var(--sub); margin:12px 0 5px;}
  label:first-of-type{margin-top:0;}
  input{width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); font-size:15px;}
  .freq-opts{display:flex; gap:8px;}
  .freq-opt{flex:1; padding:10px 6px; border:1.5px solid var(--line); border-radius:8px; text-align:center; font-size:13px; font-weight:700; cursor:pointer; color:var(--sub);}
  .freq-opt.sel{color:#fff;}
  .freq-opt[data-f="daily"].sel{background:var(--daily); border-color:var(--daily);}
  .freq-opt[data-f="weekly"].sel{background:var(--weekly); border-color:var(--weekly);}
  .freq-opt[data-f="monthly"].sel{background:var(--monthly); border-color:var(--monthly);}
  .sheet-actions{display:flex; gap:8px; margin-top:18px;}
  .sheet-actions button{flex:1; padding:12px; border-radius:9px; font-size:14.5px; font-weight:700; cursor:pointer; border:none;}
  .btn-cancel{background:transparent; border:1px solid var(--line) !important; color:var(--ink);}
  .btn-confirm{background:var(--accent); color:var(--accent-ink);}
  .hist-item{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-date{color:var(--sub); font-size:12px;}
</style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="emoji">💰</span>
      <div><strong>ระบบปล่อยเงินกู้</strong><div class="sub">DASHBOARD</div></div>
    </div>
    <button class="addbtn-main" onclick="openAddModal()">+ เพิ่มลูกหนี้ใหม่</button>
    <div class="nav-title">รายชื่อลูกหนี้</div>
    <nav id="navList"></nav>
  </aside>
  <div class="backdrop" id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn" onclick="toggleSidebar(true)">☰</button>
      <h1>สรุปยอดทั้งหมด</h1>
      <button class="icon-btn" onclick="togglePanel(true)">📅</button>
    </div>
    <div class="search-wrap">
      <span class="ico">🔍</span>
      <input id="searchInput" type="text" placeholder="ค้นหาชื่อหรือเบอร์โทรลูกค้า" oninput="setSearch(this.value)">
      <button class="clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
    <div class="stats-row">
      <div class="stat-card" style="--c:var(--accent)"><div class="lbl">ปล่อยกู้ทั้งหมด</div><div class="val tabnum" id="sumPrincipal">฿0</div></div>
      <div class="stat-card" style="--c:var(--monthly)"><div class="lbl">รับชำระแล้ว</div><div class="val tabnum" id="sumPaid">฿0</div></div>
      <div class="stat-card" style="--c:var(--daily)"><div class="lbl">คงเหลือทั้งหมด</div><div class="val tabnum" id="sumRemain">฿0</div></div>
    </div>
    <div class="filter-note" id="filterNote"></div>
    <div class="list" id="list"></div>
  </main>

  <aside class="rightpanel" id="rightpanel">
    <div class="panel-card">
      <div class="panel-title">ปฏิทิน</div>
      <div id="calendar"></div>
    </div>
    <div class="panel-card">
      <div class="panel-title">สัดส่วนลูกหนี้</div>
      <div id="breakdown"></div>
    </div>
  </aside>
  <div class="backdrop" id="panelBackdrop" onclick="togglePanel(false)"></div>
</div>

<div id="modalRoot"></div>

<script>
let data = { customers: [] };
try{
  const raw = localStorage.getItem('debtTrackerData');
  if(raw) data = JSON.parse(raw);
}catch(e){ console.error('load failed', e); }

data.customers.forEach(cust=>{
  if(!cust.charges){
    cust.charges = [{id: uid(), amount: cust.principal||0, rate: cust.rate||20, date: new Date(cust.createdAt||Date.now()).toISOString().slice(0,10)}];
  }
});

let filterState = 'all';
let searchQuery = '';
const today = new Date();
let calState = { year: today.getFullYear(), month: today.getMonth() };

function save(){
  try{ localStorage.setItem('debtTrackerData', JSON.stringify(data)); }
  catch(e){ console.error('save failed', e); }
}

function fmt(n){ return '฿' + Math.round(n).toLocaleString('th-TH'); }
function freqLabel(f){ return f==='daily' ? 'รายวัน' : f==='weekly' ? 'รายสัปดาห์' : 'รายเดือน'; }
function freqColorVar(f){
  return f==='daily' ? {c:'var(--daily)', bg:'var(--daily-bg)'} :
         f==='weekly' ? {c:'var(--weekly)', bg:'var(--weekly-bg)'} :
         {c:'var(--monthly)', bg:'var(--monthly-bg)'};
}
function calc(cust){
  const principal = cust.charges.reduce((s,c)=>s+c.amount,0);
  const interest = cust.charges.reduce((s,c)=>s+c.amount*(c.rate/100),0);
  const total = principal + interest;
  const paid = cust.payments.reduce((s,p)=>s+p.amount,0);
  const remain = Math.max(0, total - paid);
  return {principal, interest, total, paid, remain};
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function toggleSidebar(open){
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('sidebarBackdrop').classList.toggle('show', open);
}
function togglePanel(open){
  document.getElementById('rightpanel').classList.toggle('open', open);
  document.getElementById('panelBackdrop').classList.toggle('show', open);
}
function setFilter(f){
  filterState = f;
  render();
  if(window.innerWidth <= 1024) toggleSidebar(false);
}
function setSearch(v){
  searchQuery = v.trim().toLowerCase();
  document.getElementById('searchClear').classList.toggle('show', searchQuery.length>0);
  render();
}
function clearSearch(){
  searchQuery = '';
  const inp = document.getElementById('searchInput');
  if(inp) inp.value = '';
  document.getElementById('searchClear').classList.remove('show');
  render();
}

function renderNav(){
  const counts = {all:data.customers.length, daily:0, weekly:0, monthly:0};
  data.customers.forEach(c=>counts[c.frequency]++);
  const items = [
    {f:'all', label:'ทั้งหมด', dot:'all'},
    {f:'daily', label:'ลูกหนี้รายวัน', dot:'daily'},
    {f:'weekly', label:'ลูกหนี้รายสัปดาห์', dot:'weekly'},
    {f:'monthly', label:'ลูกหนี้รายเดือน', dot:'monthly'},
  ];
  document.getElementById('navList').innerHTML = items.map(it=>`
    <button class="nav-item ${filterState===it.f?'active':''}" onclick="setFilter('${it.f}')">
      <span class="dot ${it.dot}"></span>${it.label}<span class="cnt">${counts[it.f]}</span>
    </button>
  `).join('');
}

function renderCalendar(){
  const monthNames = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  const dow = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  const y = calState.year, m = calState.month;
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  const paymentDates = new Set();
  data.customers.forEach(c=>c.payments.forEach(p=>paymentDates.add(p.date)));

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += '<div></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const hasPay = paymentDates.has(dateStr);
    cells += `<div class="cal-day ${isToday?'today':''}">${d}${hasPay?'<span class="pdot"></span>':''}</div>`;
  }

  document.getElementById('calendar').innerHTML = `
    <div class="cal-head">
      <button onclick="changeMonth(-1)">‹</button>
      <span>${monthNames[m]} ${y+543}</span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;
}
function changeMonth(delta){
  calState.month += delta;
  if(calState.month < 0){ calState.month = 11; calState.year--; }
  if(calState.month > 11){ calState.month = 0; calState.year++; }
  renderCalendar();
}

function renderBreakdown(){
  const counts = {daily:0, weekly:0, monthly:0};
  data.customers.forEach(c=>counts[c.frequency]++);
  const rows = [
    {f:'daily', label:'รายวัน'}, {f:'weekly', label:'รายสัปดาห์'}, {f:'monthly', label:'รายเดือน'}
  ];
  document.getElementById('breakdown').innerHTML = rows.map(r=>`
    <div class="bd-row"><span class="dot ${r.f}"></span>${r.label}<span class="cnt2 tabnum">${counts[r.f]}</span></div>
  `).join('') + `<div class="bd-row" style="border-top:1px solid var(--line); margin-top:4px; padding-top:8px;"><strong>รวมทั้งหมด</strong><span class="cnt2 tabnum">${data.customers.length}</span></div>`;
}

function render(){
  renderNav();
  renderCalendar();
  renderBreakdown();

  let filtered = filterState==='all' ? data.customers : data.customers.filter(c=>c.frequency===filterState);
  if(searchQuery){
    filtered = filtered.filter(c =>
      c.name.toLowerCase().includes(searchQuery) || (c.phone||'').toLowerCase().includes(searchQuery)
    );
  }
  const noteMap = {all:'', daily:'กำลังแสดงเฉพาะลูกหนี้รายวัน', weekly:'กำลังแสดงเฉพาะลูกหนี้รายสัปดาห์', monthly:'กำลังแสดงเฉพาะลูกหนี้รายเดือน'};
  let note = noteMap[filterState];
  if(searchQuery) note = (note ? note+' · ' : '') + `ค้นหา "${searchQuery}" พบ ${filtered.length} รายการ`;
  document.getElementById('filterNote').textContent = note;

  const list = document.getElementById('list');
  list.innerHTML = '';
  let sp=0, spaid=0, srem=0;

  if(filtered.length === 0){
    let emptyMsg = 'ยังไม่มีรายชื่อลูกหนี้ กดปุ่ม "+ เพิ่มลูกหนี้ใหม่" เพื่อเริ่มบันทึก';
    if(data.customers.length>0 && searchQuery) emptyMsg = `ไม่พบลูกหนี้ที่ตรงกับ "${searchQuery}"`;
    else if(data.customers.length>0) emptyMsg = 'ไม่มีลูกหนี้ในหมวดนี้';
    list.innerHTML = `<div class="empty">${emptyMsg}</div>`;
  }

  filtered.forEach(cust=>{
    const {principal, interest, total, paid, remain} = calc(cust);
    sp += principal; spaid += paid; srem += remain;
    const col = freqColorVar(cust.frequency);
    const pct = total>0 ? Math.min(100, (paid/total)*100) : 0;

    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--c', col.c);
    card.style.setProperty('--bg', col.bg);
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-name">${escapeHtml(cust.name)}</div>
          <div class="card-phone">${escapeHtml(cust.phone||'-')}</div>
        </div>
        <span class="badge">${freqLabel(cust.frequency)}</span>
      </div>
      <div class="grid4">
        <div class="row"><span class="lbl">เงินต้นรวม</span><span class="tabnum">${fmt(principal)}</span></div>
        <div class="row"><span class="lbl">ดอกเบี้ยรวม</span><span class="tabnum">${fmt(interest)}</span></div>
        <div class="row"><span class="lbl" style="font-weight:700; color:var(--ink);">ยอดรวม</span><span class="tabnum" style="font-weight:700;">${fmt(total)}</span></div>
        <div class="row"><span class="lbl">จ่ายแล้ว</span><span class="tabnum">${fmt(paid)}</span></div>
      </div>
      <div class="remain">
        <span class="lbl">คงเหลือ</span>
        <span class="val tabnum" style="color:${remain<=0?'var(--monthly)':'var(--ink)'}">${remain<=0?'ชำระครบแล้ว':fmt(remain)}</span>
      </div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="actions">
        <button class="pay" onclick="openPayModal('${cust.id}')">บันทึกการจ่าย</button>
        <button onclick="openHistModal('${cust.id}')">ประวัติ</button>
        <button class="del" onclick="delCust('${cust.id}')">ลบ</button>
      </div>
      <div class="actions2">
        <button onclick="openAddDebtModal('${cust.id}')">+ เพิ่มหนี้ให้ลูกค้ารายนี้</button>
      </div>
    `;
    list.appendChild(card);
  });

  document.getElementById('sumPrincipal').textContent = fmt(sp);
  document.getElementById('sumPaid').textContent = fmt(spaid);
  document.getElementById('sumRemain').textContent = fmt(srem);
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function openAddModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <h2>เพิ่มลูกหนี้ใหม่</h2>
        <label>ชื่อลูกหนี้</label>
        <input id="fName" type="text" placeholder="ชื่อ-นามสกุล">
        <label>เบอร์โทร</label>
        <input id="fPhone" type="tel" placeholder="08X-XXX-XXXX">
        <label>จำนวนเงินกู้ (บาท)</label>
        <input id="fPrincipal" type="number" inputmode="decimal" placeholder="0">
        <label>ดอกเบี้ย (%)</label>
        <input id="fRate" type="number" inputmode="decimal" value="20">
        <label>รูปแบบการจ่าย</label>
        <div class="freq-opts">
          <div class="freq-opt sel" data-f="daily" onclick="pickFreq(this)">รายวัน</div>
          <div class="freq-opt" data-f="weekly" onclick="pickFreq(this)">รายสัปดาห์</div>
          <div class="freq-opt" data-f="monthly" onclick="pickFreq(this)">รายเดือน</div>
        </div>
        <div class="sheet-actions">
          <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
          <button class="btn-confirm" onclick="submitAdd()">บันทึก</button>
        </div>
      </div>
    </div>
  `;
}
function pickFreq(el){
  el.parentElement.querySelectorAll('.freq-opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
}
function submitAdd(){
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const principal = parseFloat(document.getElementById('fPrincipal').value) || 0;
  const rate = parseFloat(document.getElementById('fRate').value) || 0;
  const freqEl = document.querySelector('.freq-opt.sel');
  const frequency = freqEl ? freqEl.dataset.f : 'daily';
  if(!name || principal<=0){ showAlert('กรุณากรอกชื่อและจำนวนเงินกู้ให้ถูกต้อง'); return; }
  data.customers.unshift({
    id: uid(), name, phone, frequency, createdAt: Date.now(), payments: [],
    charges: [{id: uid(), amount: principal, rate, date: new Date().toISOString().slice(0,10)}]
  });
  save(); render(); closeModal();
}

function openAddDebtModal(id){
  const cust = data.customers.find(c=>c.id===id);
  if(!cust) return;
  const todayStr = new Date().toISOString().slice(0,10);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <h2>เพิ่มหนี้ — ${escapeHtml(cust.name)}</h2>
        <label>จำนวนเงินที่เพิ่ม (บาท)</label>
        <input id="dAmount" type="number" inputmode="decimal" placeholder="0">
        <label>ดอกเบี้ย (%)</label>
        <input id="dRate" type="number" inputmode="decimal" value="20">
        <label>วันที่</label>
        <input id="dDate" type="date" value="${todayStr}">
        <div class="sheet-actions">
          <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
          <button class="btn-confirm" onclick="submitAddDebt('${id}')">บันทึก</button>
        </div>
      </div>
    </div>
  `;
}
function submitAddDebt(id){
  const cust = data.customers.find(c=>c.id===id);
  const amount = parseFloat(document.getElementById('dAmount').value) || 0;
  const rate = parseFloat(document.getElementById('dRate').value) || 0;
  const date = document.getElementById('dDate').value || new Date().toISOString().slice(0,10);
  if(amount<=0){ showAlert('กรุณากรอกจำนวนเงินให้ถูกต้อง'); return; }
  cust.charges.push({id: uid(), amount, rate, date});
  save(); render(); closeModal();
}

function openPayModal(id){
  const cust = data.customers.find(c=>c.id===id);
  if(!cust) return;
  const todayStr = new Date().toISOString().slice(0,10);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <h2>บันทึกการจ่าย — ${escapeHtml(cust.name)}</h2>
        <label>จำนวนเงินที่จ่าย (บาท)</label>
        <input id="pAmount" type="number" inputmode="decimal" placeholder="0">
        <label>วันที่</label>
        <input id="pDate" type="date" value="${todayStr}">
        <div class="sheet-actions">
          <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
          <button class="btn-confirm" onclick="submitPay('${id}')">บันทึก</button>
        </div>
      </div>
    </div>
  `;
}
function submitPay(id){
  const cust = data.customers.find(c=>c.id===id);
  const amount = parseFloat(document.getElementById('pAmount').value) || 0;
  const date = document.getElementById('pDate').value || new Date().toISOString().slice(0,10);
  if(amount<=0){ showAlert('กรุณากรอกจำนวนเงินให้ถูกต้อง'); return; }
  cust.payments.push({id: uid(), amount, date});
  save(); render(); closeModal();
}

function openHistModal(id){
  const cust = data.customers.find(c=>c.id===id);
  if(!cust) return;
  const pays = cust.payments.map(p=>({...p, kind:'pay'}));
  const debts = cust.charges.map(c=>({...c, kind:'debt'}));
  const items = [...pays, ...debts].sort((a,b)=>b.date.localeCompare(a.date));
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <h2>ประวัติ — ${escapeHtml(cust.name)}</h2>
        ${items.length===0 ? '<div class="empty">ยังไม่มีประวัติ</div>' :
          items.map(it=>`<div class="hist-item"><span>${it.kind==='debt'?'+ เพิ่มหนี้ ':'จ่าย '}${fmt(it.amount)}${it.kind==='debt'?' (ดอกเบี้ย '+it.rate+'%)':''}</span><span class="hist-date">${it.date}</span></div>`).join('')}
        <div class="sheet-actions">
          <button class="btn-confirm" style="flex:1" onclick="closeModal()">ปิด</button>
        </div>
      </div>
    </div>
  `;
}

function delCust(id){
  const cust = data.customers.find(c=>c.id===id);
  if(!cust) return;
  const {remain} = calc(cust);
  const msg = remain > 0
    ? `ลูกค้ารายนี้ยังค้างชำระอยู่ ${fmt(remain)} ต้องการลบรายชื่อนี้ใช่หรือไม่?`
    : 'ต้องการลบรายชื่อนี้ใช่หรือไม่?';
  showConfirm(msg, ()=>{
    data.customers = data.customers.filter(c=>c.id!==id);
    save(); render();
  });
}

function showConfirm(message, onYes){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <h2>ยืนยัน</h2>
        <p style="font-size:14.5px; line-height:1.6; margin:0;">${escapeHtml(message)}</p>
        <div class="sheet-actions">
          <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
          <button class="btn-confirm" style="background:var(--danger)" id="confirmYesBtn">ลบรายชื่อ</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('confirmYesBtn').onclick = function(){ closeModal(); onYes(); };
}
function showAlert(message){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <h2>แจ้งเตือน</h2>
        <p style="font-size:14.5px; line-height:1.6; margin:0;">${escapeHtml(message)}</p>
        <div class="sheet-actions">
          <button class="btn-confirm" style="flex:1" onclick="closeModal()">ตกลง</button>
        </div>
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
